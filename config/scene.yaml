# Object and zone positions shared by skill_server (which moves the robot)
# and task_runner (which only needs the name lists, to validate an LLM plan).
# Duplicated under both node names rather than a "/**:" wildcard -- wildcard
# parameter overrides were observed not to reach get_parameter() reliably
# with this ROS 2 Humble / RoboStack build.
skill_server:
  ros__parameters:
    planning_group: "ur_manipulator"
    # Table top is at z=0.20 in worlds/tabletop.sdf; cubes are 4 cm, centered
    # at z=0.22. approach_height is how far above the target the end-effector
    # lifts before/after each pick or place (must clear the table + cube).
    approach_height: 0.12
    pick_descend_z: 0.22
    place_descend_z: 0.22
    velocity_scaling: 0.15
    acceleration_scaling: 0.15

    objects:
      names: ["red_cube", "yellow_cube", "blue_cube"]
      red_cube.x: 0.35
      red_cube.y: 0.18
      yellow_cube.x: 0.35
      yellow_cube.y: 0.0
      blue_cube.x: 0.35
      blue_cube.y: -0.18

    zones:
      names: ["zone_a", "zone_b", "zone_c"]
      zone_a.x: 0.20
      zone_a.y: 0.18
      zone_b.x: 0.20
      zone_b.y: 0.0
      zone_c.x: 0.20
      zone_c.y: -0.18

task_runner:
  ros__parameters:
    objects:
      names: ["red_cube", "yellow_cube", "blue_cube"]
    zones:
      names: ["zone_a", "zone_b", "zone_c"]
